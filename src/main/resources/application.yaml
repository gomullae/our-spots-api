spring:
  application:
    name: our-spots-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:6543/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      # 운영 환경: validate (스키마 검증만), 로컬: local 프로파일에서 update 사용
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  admin-password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 504
  # 관리자 페이지에서 개별 장소 구글 평점 동기화에 사용 (배치 전용 GOOGLE_API_KEY와 같은 값 공유)
  google-api-key: ${GOOGLE_API_KEY:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    expense-chat-id: ${TELEGRAM_EXPENSE_CHAT_ID:}
    schedule-chat-id: ${TELEGRAM_SCHEDULE_CHAT_ID:}
  # 사진 업로드(Cloudflare R2, S3 호환) — 장소/일정 사진 첨부용
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:}
    public-url: ${R2_PUBLIC_URL:}
